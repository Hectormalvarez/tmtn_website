services:
  # Production Container (Always Running)
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: tmtn-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-9150}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=${HOSTNAME:-0.0.0.0}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}

  # Development Container (On-Demand)
  web-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: tmtn-dev
    ports:
      - "127.0.0.1:${DEV_PORT:-8889}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=${HOSTNAME:-0.0.0.0}
      - WATCHPACK_POLLING=true
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
